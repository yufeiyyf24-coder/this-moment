plugins { id 'com.android.application' }
android {
    namespace 'com.cike.moment'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cike.moment'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['../../demo/dist'] } }
}

