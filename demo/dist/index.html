<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>此刻</title><meta name="theme-color" content="#f8fbf1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2392b94e'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='3' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div><h1>此刻<span class="mark" aria-hidden="true">🌱</span></h1><p>不必记得。此刻记下就好。</p></div><span class="draft">仅存本机</span></header>

<section id="record">
<div class="record-toolbar"><div class="section-head moment-heading"><div><h2>这一刻</h2><button class="text-button" id="time-toggle">现在 <span>⌄</span></button></div><div class="record-actions"><button type="button" class="text-button" id="cancel-edit" hidden>取消</button><button class="save quick-save" id="save">记下 <span aria-hidden="true">↗</span></button></div></div><label id="time-field" hidden>发生时间<input type="datetime-local" id="occurred"></label></div><div id="record-scroll">
<section id="selected-area" hidden><div class="section-head"><h3>已选 <span id="selected-count"></span></h3><span class="meta">点标签可补充</span></div><div id="selected"></div></section>
<label id="legacy-note-field" class="note-label" hidden>这条记录原有的补充<textarea id="legacy-note" rows="2"></textarea></label><p class="selection-hint">挑几个词，留住现在。</p>
<section class="favorites"><div class="section-head"><h3>手边的词</h3><button class="text-button" id="add">＋ 添加</button></div><div class="chips" id="favorites"></div></section>
<div id="categories"></div>




<section class="history"><div class="section-head"><h2>留下的片刻</h2><span class="meta" id="history-count">这次预览</span></div><div id="history"><p class="empty">记下的片刻，会留在这里。</p></div></section>
</div></section>
<section id="export" hidden><div class="section-head"><h2>把这些片刻，整理一下</h2></div><p class="subtext">按一段时间回看，也可以带去复诊。</p><div class="chips ranges"><button class="chip active">7 天</button><button class="chip">14 天</button><button class="chip">30 天</button><button class="chip">自定义</button></div><div id="custom-range" hidden><label>开始日期<input type="date"></label><label>结束日期<input type="date"></label></div><div class="export-placeholder"><span class="small-title">记录摘要</span><p>这里会整理每个标签的<br><strong>记录次数</strong>和<strong>出现天数</strong>。</p><span class="meta">未记录的日子，不等于没有发生。</span></div><div class="outline-row"><span>复制复诊摘要</span><span class="meta">下一步接入</span></div><div class="outline-row"><span>导出完整备份</span><span class="meta">下一步接入</span></div><div class="outline-row"><span>导入备份</span><span class="meta">下一步接入</span></div><p class="demo-note">这一页先确认布局，暂不生成真实报告。</p></section>
<nav aria-label="主导航"><button class="tab active" data-page="record" aria-pressed="true">记录</button><button class="tab" data-page="export" aria-pressed="false">导出</button></nav>
<footer>给当下留一点位置。</footer></main>
<dialog id="add-dialog"><form id="add-form"><div class="section-head"><h2>添加到常用</h2><button type="button" id="close" class="text-button" aria-label="关闭">✕</button></div><p class="subtext">选一个已有标签，或写下自己的说法。</p><div class="chips" id="library"></div><hr><label>自定义标签<input id="custom-name" maxlength="24" placeholder="比如：说不清的难受"></label><label>分类<select id="custom-category"><option>情绪</option><option>身体</option><option>状态</option><option>念头与冲动</option><option>活动</option><option>用药</option><option>其他 / 不确定</option></select></label><fieldset id="body-part-field" hidden><legend>部位 · 可多选</legend><div class="part-options"><label><input type="checkbox" name="body-part" value="头部">头部</label><label><input type="checkbox" name="body-part" value="胸部">胸部</label><label><input type="checkbox" name="body-part" value="腹部">腹部</label><label><input type="checkbox" name="body-part" value="手部">手部</label><label><input type="checkbox" name="body-part" value="四肢">四肢</label><label><input type="checkbox" name="body-part" value="全身">全身</label><label><input type="checkbox" name="body-part" value="其他部位">其他部位</label></div></fieldset><label>描述 · 可不填<input id="custom-description" maxlength="100" placeholder="比如：从心口传到手掌"></label><button class="save" type="submit">添加自定义标签</button></form></dialog><dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">删除这条记录？</h2><p id="delete-preview" class="subtext"></p><p class="meta">删除后可以用“撤销删除”恢复。</p><div class="delete-actions"><button type="button" class="text-button" id="cancel-delete">取消</button><button type="button" class="danger-button" id="confirm-delete">删除</button></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
